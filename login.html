<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <title>Masuk — Rak</title>
    <style>
      .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
      .login-card{width:min(400px,100%);background:#191a1f;border:1px solid #2d2e35;border-radius:14px;padding:34px 30px 28px;box-shadow:0 30px 80px #0009;position:relative;overflow:hidden}
      .login-card:before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#c3f36a1f,transparent 70%);top:-90px;right:-70px}
      .login-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-1.3px;margin-bottom:26px;position:relative}
      .login-brand .brand-dot{color:var(--accent)}
      .login-card h1{font:700 22px/1.3 var(--display);letter-spacing:-.6px;margin:0 0 8px;position:relative}
      .login-card p{color:#94949d;font-size:12px;line-height:1.65;margin:0 0 22px;position:relative}
      .login-form{position:relative}
      .login-form input{width:100%;border:1px solid #35363d;border-radius:8px;background:#121317;color:#efeff0;padding:12px 13px;outline:none;font-size:13px}
      .login-form input:focus{border-color:#718746;box-shadow:0 0 0 2px #c3f36616}
      .login-form button{width:100%;margin-top:12px;background:var(--accent);border:0;color:#171a11;font-weight:700;font-size:12px;border-radius:8px;padding:12px;cursor:pointer;transition:background .15s}
      .login-form button:hover{background:#d1ff7d}
      .login-error{color:#ff8585;font-size:11px;min-height:16px;margin-top:10px}
      .login-note{margin-top:22px;padding-top:18px;border-top:1px solid #292a31;font-size:10px;color:#70717a;line-height:1.7;position:relative}
      .login-note code{background:#212228;padding:2px 5px;border-radius:4px;color:#c3f36a;font-size:10px}
      .login-note strong{color:#b9b9c0}
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span>rak<span class="brand-dot">.</span></span>
        </div>
        <h1>Masuk ke rak kamu</h1>
        <p>Rak ini berisi daftar bacaan pribadi dan tersimpan di server ini saja.</p>
        <form class="login-form" id="loginForm">
          <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required autofocus />
          <button type="submit">Buka rak</button>
          <div class="login-error" id="loginError"></div>
        </form>
        <div class="login-note">
          Password ada di terminal tempat server dijalankan. Lihat juga <strong>SECURITY.md</strong>.
          <br />Butuh bantuan? <code>npm run reset</code> untuk mengatur ulang.
        </div>
      </div>
    </div>
    <script>
      const form = document.getElementById('loginForm');
      const error = document.getElementById('loginError');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        const password = document.getElementById('passwordInput').value;
        try {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          if (res.ok) { location.href = '/'; return; }
          error.textContent = res.status === 429 ? 'Terlalu banyak percobaan. Tunggu sebentar.' : 'Password salah.';
        } catch {
          error.textContent = 'Gagal menghubungi server.';
        }
      });
    </script>
  </body>
</html>
